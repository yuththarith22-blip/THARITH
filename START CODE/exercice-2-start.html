<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
      }

      .main {
        display: flex;
        gap:3em;
        padding-left: 3em;
        padding-right: 3em;
        

        height: 100vh;

        background: #25384B;
      }

      .left-section {
        flex-grow: 1;
        background: #A3CFCC;
        
      }

      .right-section {
        display: flex;
        flex-direction: column;
        padding-left: 1em;
        padding-right: 1em;
        padding: 1em;
        gap: 1em;
        width: 10em;


        background: #F7CFB6;
  
      }

      .item {
        background: #86C2DE;
        height: 100px;
        
       
      }
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section"></section>
      <section class="right-section">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </section>
    </div>
  </body>
</html>
